<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página con Fondo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;

            /* OPCIÓN 1: Fondo Degradado Moderno (Activo) */
            background: linear-gradient(135deg, #1f1c2c 0%, #928dab 100%);

            /* OPCIÓN 2: Fondo con Imagen (Descomenta quitando /* y */ para usar) */
            /*
            background-image: url('https://picsum.photos/1920/1080');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            */

            /* OPCIÓN 3: Fondo de Color Sólido (Descomenta para usar) */
            /* background-color: #0f172a; */
        }

        /* Tarjeta contenedora de contenido */
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 2.5rem;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.8rem;
        }

        p {
            font-size: 1rem;
            color: #e0e0e0;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Diseño con Fondo</h1>
        <p>Este plantilla incluye un fondo degradado con efecto de cristal (glassmorphism) en el contenedor principal.</p>
    </div>

</body>
</html>
